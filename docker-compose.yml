# Laboratorio 2 (CC3067 Redes) — levanta emisor (8000) y receptor (3000) juntos.

services:
  receptor:
    build:
      context: ./receptor
    ports:
      - "3000:3000"
      - "5001:5001"

  emisor:
    build:
      context: ./emisor
    ports:
      - "8000:8000"
    environment:
      RECEPTOR_HOST: receptor
      RECEPTOR_PUERTO: "5001"
    depends_on:
      - receptor
